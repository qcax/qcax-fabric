name: Bug report
description: Report a reproducible QCAX Fabric defect
title: "[bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: reproduction
    attributes: {label: Reproduction, description: Include exact versions/artifact identities and commands.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected invariant}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Actual evidence / receipts}
    validations: {required: true}
