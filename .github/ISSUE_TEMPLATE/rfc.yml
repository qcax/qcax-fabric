name: RFC / architecture proposal
description: Propose a public contract or TCB change
title: "[rfc] "
labels: ["type:rfc", "risk:api"]
body:
  - type: textarea
    id: problem
    attributes: {label: Demonstrated problem / blocker}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed change}
    validations: {required: true}
  - type: textarea
    id: compatibility
    attributes: {label: Compatibility, rollback, tests and migration}
    validations: {required: true}
