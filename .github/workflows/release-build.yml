name: release-build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag identity used for prebuild lock generation"
        required: true
        default: "v0.1.0-alpha.1"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 observed 2026-08-22
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/test.txt
      - run: python scripts/run_all.py
      - name: Build reproducible standard wheels
        run: python scripts/run_standard_build_repro.py wheelhouse
      - name: Generate exact-artifact release lock
        env:
          QCAX_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: python scripts/generate_release_lock.py wheelhouse release-lock.json "$QCAX_RELEASE_TAG"
      - name: Prepare exact wheel contents for SBOM scan
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          src=Path('wheelhouse')
          dst=Path('sbom-root')
          if dst.exists(): shutil.rmtree(dst)
          dst.mkdir()
          wheels=sorted(src.glob('*.whl'))
          if not wheels: raise SystemExit('no wheels for SBOM scan')
          for wheel in wheels:
              out=dst/wheel.stem
              out.mkdir()
              with zipfile.ZipFile(wheel) as z:
                  z.extractall(out)
          print(f'prepared {len(wheels)} wheels for SBOM scan')
          PY
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0 observed 2026-08-22
        with:
          path: sbom-root
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Validate release SBOM coverage
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          lock=json.loads(Path('release-lock.json').read_text(encoding='utf-8'))
          sbom=json.loads(Path('sbom.spdx.json').read_text(encoding='utf-8'))
          if sbom.get('spdxVersion')!='SPDX-2.3': raise SystemExit('unexpected SPDX version')
          norm=lambda s: re.sub(r'[-_.]+','-',s).lower()
          expected={norm(e['distribution_name']) for e in lock['entries']}
          observed={norm(p.get('name','')) for p in sbom.get('packages',[]) if p.get('name')}
          missing=sorted(expected-observed)
          if missing: raise SystemExit(f'SBOM missing release distributions: {missing}')
          print(json.dumps({'status':'PASS','expected_distributions':len(expected),'observed_packages':len(observed),'missing':missing},sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-wheels
          path: |
            wheelhouse/*.whl
            release-lock.json
            sbom.spdx.json
          if-no-files-found: error
  attest-build:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-wheels
          path: release-assets
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/wheelhouse/*.whl
      - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: release-assets/wheelhouse/*.whl
          sbom-path: release-assets/sbom.spdx.json
