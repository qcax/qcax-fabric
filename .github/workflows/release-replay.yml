name: release-replay

on:
  release:
    types: [published]

permissions: {}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACTIONS_CACHE_MODE: none
      QCAX_EXPECTED_COMMIT: ${{ github.sha }}
      QCAX_RELEASE_TAG: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Require exact immutable release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python release/tooling/assert_release_event.py
      - run: python -m pip install -r requirements/test.txt -r requirements/release.txt
      - name: Full assurance from exact published tag
        run: python tools/run_all.py
      - name: Rebuild independently without release cache
        run: python release/tooling/build_candidate.py --out replay-assets --twin-builds 2 --replay
      - name: Generate replay SBOM
        run: python release/tooling/prepare_sbom_root.py replay-assets replay-sbom-root
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: replay-sbom-root
          format: spdx-json
          output-file: replay-assets/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Finalize and verify replay candidate
        run: |
          python release/tooling/finalize_payload.py replay-assets
          python release/tooling/verify_candidate.py replay-assets
      - name: Download exact immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --repo "$GITHUB_REPOSITORY" --dir published-assets
      - name: Compare class-aware replay equivalence
        run: >
          python release/tooling/compare_replay.py replay-assets
          --published published-assets
          --repo "$GITHUB_REPOSITORY"
          --tag "${{ github.event.release.tag_name }}"
          > replay-comparison.json
      - name: Write replay receipt
        run: >
          python release/tooling/record_replay_receipt.py
          --candidate replay-assets
          --comparison replay-comparison.json
          --out replay-receipt.json
      - name: Upload replay receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qcax-replay-receipt-${{ github.event.release.tag_name }}
          path: replay-receipt.json
          if-no-files-found: error
          retention-days: 30
