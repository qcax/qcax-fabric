name: release-preflight

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Exact 40-hex commit currently at main"
        required: true
      release_tag:
        description: "Must equal activated release/policy/release-contract.json identity"
        required: true

concurrency:
  group: qcax-release-preflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACTIONS_CACHE_MODE: none
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Assert exact activated source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.expected_commit }}" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REPOSITORY" = "qcax/qcax-fabric"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "${{ inputs.expected_commit }}"
          python release/tooling/activate_contract.py --tag "${{ inputs.release_tag }}" --commit "${{ inputs.expected_commit }}" --verify-only
      - name: Install exact admitted release toolchain
        run: python -m pip install -r requirements/test.txt -r requirements/release.txt
      - name: Full assurance
        run: python tools/run_all.py
      - name: Build clean twin candidate
        env:
          QCAX_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          QCAX_RELEASE_TAG: ${{ inputs.release_tag }}
        run: python release/tooling/build_candidate.py --out release-assets --twin-builds 2
      - name: Secure exact-wheel and out-of-tree canaries
        run: |
          python conformance/run_exact_wheel_canaries.py release-assets
          python conformance/run_out_of_tree_canary.py release-assets
      - name: Prepare exact wheel roots for SBOM
        run: python release/tooling/prepare_sbom_root.py release-assets sbom-root
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: sbom-root
          format: spdx-json
          output-file: release-assets/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Finalize and verify derived artifact set
        env:
          QCAX_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          QCAX_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python release/tooling/finalize_payload.py release-assets
          python release/tooling/verify_candidate.py release-assets
      - name: Attest exact release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-assets/*
      - name: Attest wheel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-assets/*.whl
          sbom-path: release-assets/sbom.spdx.json
      - name: Verify prepublication attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python release/tooling/verify_github_attestations.py release-assets
      - name: Upload candidate
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qcax-release-candidate-${{ inputs.release_tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Record external preflight receipt
        env:
          ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
        run: >
          python release/tooling/record_preflight_receipt.py
          --candidate release-assets
          --out preflight-receipt.json
      - name: Upload preflight receipt outside candidate container
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qcax-preflight-receipt-${{ inputs.release_tag }}
          path: preflight-receipt.json
          if-no-files-found: error
          retention-days: 30
