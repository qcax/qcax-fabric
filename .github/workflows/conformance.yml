name: conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semantic-mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/test.txt
      - run: python conformance/run_mutations.py

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/test.txt -r requirements/release.txt
      - run: python conformance/run_installed_image.py

  import-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/test.txt
      - run: python tools/validate_authority_boundaries.py

  release-payload-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTIONS_CACHE_MODE: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/test.txt -r requirements/release.txt
      - run: python release/tooling/build_candidate.py --mode pr-exercise --out release/generated/pr-candidate
      - run: python release/tooling/finalize_payload.py release/generated/pr-candidate
      - run: python release/tooling/verify_candidate.py release/generated/pr-candidate
      - name: W8 candidate validation and mutation test-of-tests
        env:
          QCAX_W8_CANDIDATE_DIR: release/generated/pr-candidate
          QCAX_W8_RECEIPTS_DIR: release/generated/pr-candidate-rehearsal/receipts
        run: |
          python tools/validate_w8.py --candidate release/generated/pr-candidate
          python tests/release/test_w8_mutations.py
      - run: python conformance/run_exact_wheel_canaries.py release/generated/pr-candidate
