[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "qcax-fabric-plugin-truth-policy"
version = "0.1.0a1"
description = "QCAX Fabric plugin: truth-policy"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["qcax-fabric-contracts==0.1.0a1", "qcax-fabric-sdk==0.1.0a1"]
[project.entry-points."qcax.fabric.plugins"]
truth_policy = "qcax_plugin_truth_policy:definition"
[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"qcax_plugin_truth_policy" = ["qcax-plugin.json"]
