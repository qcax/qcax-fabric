name: conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-wheel:
    name: installed-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 observed 2026-08-22
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/test.txt
      - run: python scripts/run_installed_conformance.py
  import-boundary:
    name: import-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 observed 2026-08-22
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/test.txt
      - run: python scripts/validate_repo.py
  semantic-mutations:
    name: semantic-mutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 observed 2026-08-22
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/test.txt
      - run: python scripts/run_mutations.py
  release-payload-pr:
    name: release-payload-pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 observed 2026-08-22
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements/test.txt -r requirements/release.txt
      - name: Build complete release candidate from PR checkout
        env:
          QCAX_RELEASE_TAG: v0.1.0-alpha.1
          QCAX_EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/build_release_candidate.py --out release-assets --tag "$QCAX_RELEASE_TAG" --commit "$QCAX_EXPECTED_COMMIT"
      - name: Exact-wheel canaries
        run: |
          python scripts/run_secure_installed_canary.py release-assets
          python scripts/run_out_of_tree_canary.py release-assets
      - name: Prepare exact wheel contents for SBOM scan
        run: python scripts/prepare_release_sbom_root.py release-assets sbom-root
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0 observed 2026-08-22
        with:
          path: sbom-root
          format: spdx-json
          output-file: release-assets/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Finalize and verify exact 30-asset candidate
        env:
          QCAX_RELEASE_TAG: v0.1.0-alpha.1
          QCAX_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python scripts/finalize_release_payload.py release-assets --tag "$QCAX_RELEASE_TAG" --commit "$QCAX_EXPECTED_COMMIT"
          python scripts/verify_release_payload.py release-assets --tag "$QCAX_RELEASE_TAG" --commit "$QCAX_EXPECTED_COMMIT"
