name: pypi-publish
on:
  workflow_dispatch:
permissions: {}
jobs:
  publish:
    if: ${{ false }} # R5 must remove only after exact Trusted Publisher + environment verification.
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
